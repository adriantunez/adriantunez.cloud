name: reusable-hugo

# Builds the Hugo site and, optionally, uploads it to the site bucket.
# - Production: bucket root, keeping the previews/ folder untouched.
# - PR preview: previews/pr<N>/ only.

on:
  workflow_call:
    inputs:
      HUGO_ENVIRONMENT:
        description: "Hugo environment (production or preview); loads config/<environment>/ on top of config/_default/"
        type: string
        required: true
      BASE_URL:
        description: "Site URL the build links to (e.g. https://pr12.preview.adriantunez.cloud/)"
        type: string
        required: true
      DEPLOY:
        description: "Upload the site to S3 after building (false: build only)"
        type: boolean
        default: false
      ROLE_NAME:
        description: "IAM role to assume to upload (e.g. DeployOidcWebRole-prod); required to deploy"
        type: string
        default: ""
      GHA_ENVIRONMENT:
        description: "GitHub Actions environment for the deploy job (empty: none, e.g. PR previews)"
        type: string
        default: ""
      S3_PREFIX:
        description: "Bucket folder to upload to (empty: bucket root, i.e. production; e.g. previews/pr12)"
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

env:
  # Published by WebHostingStack, see infrastructure/config/config.ts
  SSM_BUCKET_NAME: /web/prod/bucketName
  SSM_DISTRIBUTION_ID: /web/prod/distributionId

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ vars.HUGO_PATH }}
    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # was: actions/checkout@v4
        with:
          submodules: recursive # get hugo theme submodule

      - name: Read Hugo version from .tool-versions
        working-directory: .
        run: echo "HUGO_VERSION=$(awk '$1 == "hugo" { print $2 }' .tool-versions)" >> "$GITHUB_ENV"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@75d2e84710de30f6ff7268e08f310b60ef14033f # was: peaceiris/actions-hugo@v3
        with:
          extended: true
          hugo-version: ${{ env.HUGO_VERSION }}

      - name: Build Hugo site
        env:
          HUGO_ENVIRONMENT: ${{ inputs.HUGO_ENVIRONMENT }}
          BASE_URL: ${{ inputs.BASE_URL }}
        run: hugo --environment "$HUGO_ENVIRONMENT" --baseURL "$BASE_URL" --minify -d output/

      - name: Upload Hugo artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # was: actions/upload-artifact@v3
        if: ${{ inputs.DEPLOY }}
        with:
          name: hugo-site
          path: ${{ vars.HUGO_PATH }}/output/
          if-no-files-found: error

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: build
    if: ${{ inputs.DEPLOY }}
    environment:
      name: ${{ inputs.GHA_ENVIRONMENT }} # empty: job runs without an environment
      url: ${{ inputs.BASE_URL }}
    steps:
      - name: Download Hugo artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # was: actions/download-artifact@v3
        with:
          name: hugo-site
          path: output/

      - name: Configure AWS credentials for deployment
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # was: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ inputs.ROLE_NAME }}
          role-session-name: hugo-deploy
          aws-region: eu-west-1
          role-duration-seconds: 3600

      - name: Read SSM params (bucket & distribution)
        id: ssm
        run: |
          echo "bucket=$(aws ssm get-parameter --name "$SSM_BUCKET_NAME" --query 'Parameter.Value' --output text)" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(aws ssm get-parameter --name "$SSM_DISTRIBUTION_ID" --query 'Parameter.Value' --output text)" >> "$GITHUB_OUTPUT"

      # Production syncs the bucket root but leaves PR previews alone.
      # A preview only touches its own folder (previews/pr<N>/).
      - name: Push to S3
        env:
          BUCKET: ${{ steps.ssm.outputs.bucket }}
          PREFIX: ${{ inputs.S3_PREFIX }}
        run: |
          if [ -n "$PREFIX" ]; then
            aws s3 sync output/ "s3://${BUCKET}/${PREFIX}/" --delete
          else
            aws s3 sync output/ "s3://${BUCKET}/" --delete --exclude "previews/*"
          fi

      # The edge function rewrites preview URLs before the cache, so a preview is cached
      # under /previews/pr<N>/ and only that folder needs invalidating.
      - name: Invalidate CloudFront CDN
        env:
          DIST_ID: ${{ steps.ssm.outputs.distribution_id }}
          PREFIX: ${{ inputs.S3_PREFIX }}
        run: aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/${PREFIX:+$PREFIX/}*"
