name: reusable-cdk

# Runs `cdk diff` (pull requests) or `cdk deploy` (releases) for every stack.
# The AWS account comes from the assumed role; the rest lives in infrastructure/config/config.ts.

on:
  workflow_call:
    inputs:
      COMMAND:
        description: "CDK command to run: diff or deploy"
        type: string
        required: true
      ROLE_NAME:
        description: "IAM role to assume through GitHub OIDC (e.g. DiffOidcCdkRole-prod)"
        type: string
        required: true
      GHA_ENVIRONMENT:
        description: "GitHub Actions environment (empty: none)"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

env:
  CDK_DISABLE_CLI_TELEMETRY: true

jobs:
  cdk:
    name: ${{ inputs.COMMAND }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.GHA_ENVIRONMENT }}
    defaults:
      run:
        working-directory: ${{ vars.INFRA_PATH }}
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # was: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # was: actions/setup-node@v4
        with:
          node-version-file: "${{ vars.INFRA_PATH }}/.nvmrc"
          cache: npm
          cache-dependency-path: "${{ vars.INFRA_PATH }}/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Short-living AWS credentials from OIDC token and role
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # was: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ inputs.ROLE_NAME }}
          role-session-name: cdk-${{ inputs.COMMAND }}
          aws-region: eu-west-1
          role-duration-seconds: 3600

      - name: Run cdk ${{ inputs.COMMAND }}
        run: npm run cdk:${{ inputs.COMMAND }}
