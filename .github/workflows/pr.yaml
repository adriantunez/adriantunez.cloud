name: PR Workflow

on:
  pull_request:

permissions:
  contents: read
  id-token: write
  actions: write
  pull-requests: write

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true # only cancel in-progress runs for PRs

jobs:
  dispatcher:
    uses: ./.github/workflows/reusable-dispatcher.yml
    with:
      github_event_name: ${{ github.event_name }}
      base: ${{ github.event.pull_request.base.sha }}
      ref: ${{ github.event.pull_request.head.sha }}
      filters: .github/filters.yml

  cdk_tests:
    if: ${{ needs.dispatcher.outputs.changes == 'true' }}
    needs: dispatcher
    uses: ./.github/workflows/reusable-cdk-tests.yml
    with:
      AUDIT_LEVEL: moderate

  cdk_diff:
    if: ${{ needs.dispatcher.outputs.changes == 'true' }}
    needs: dispatcher
    uses: ./.github/workflows/reusable-cdk.yml
    with:
      COMMAND: diff
      ROLE_NAME: DiffOidcCdkRole-prod

  preview:
    if: ${{ needs.dispatcher.outputs.changes == 'true' }}
    needs: dispatcher
    uses: ./.github/workflows/reusable-hugo.yml
    with:
      HUGO_ENVIRONMENT: preview
      BASE_URL: https://pr${{ github.event.pull_request.number }}.preview.adriantunez.cloud/
      DEPLOY: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
      ROLE_NAME: PreviewOidcWebRole-prod
      S3_PREFIX: previews/pr${{ github.event.pull_request.number }}

  preview_comment:
    if: ${{ needs.preview.result == 'success' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    needs: preview
    runs-on: ubuntu-latest
    steps:
      - name: Post or update the preview link
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- pr-preview -->'
          body="${marker}
          **Preview:** https://pr${PR}.preview.adriantunez.cloud/ (commit \`${SHA::7}\`)"
          id=$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${id}" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/${REPO}/issues/${PR}/comments" -f body="$body" > /dev/null
          fi

  all-good:
    if: ${{ !cancelled() && needs.dispatcher.result == 'success' }}
    needs: [dispatcher, cdk_tests, cdk_diff, preview, preview_comment]
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
