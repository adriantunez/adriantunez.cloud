{{ if ne .Params.showNewsletter false }}
<section class="newsletter-card" aria-label="Newsletter signup">
  {{ if ne .Section "newsletter" }}<h2>Newsletter</h2>{{ end }}
  <p id="newsletter-description">{{ .Params.newsletterDescription | default "Get my notes on AWS, platform engineering, and what I learn running systems in production." }}</p>
  <form class="space-y-3" action="https://assets.mailerlite.com/jsonp/1890631/forms/169761461082523558/subscribe"
    method="POST" id="newsletter-form">
    <div class="flex flex-col sm:flex-row">
      <input type="text" id="newsletter-name" aria-label="Your name" name="fields[name]" required placeholder="Your name" autocomplete="name"
        class="flex-1 mb-2 sm:mb-0 sm:mr-3 shadow appearance-none border border-neutral-300 dark:border-neutral-600 rounded px-3 py-2 bg-white dark:bg-neutral-700 text-neutral-900 dark:text-neutral-100 leading-tight focus:outline-none focus:ring-2 focus:ring-primary-500 h-10" />
      <input type="email" id="newsletter-email" aria-label="Your email" name="fields[email]" required placeholder="your@email.com"
        autocomplete="email"
        class="flex-1 sm:ml-3 shadow appearance-none border border-neutral-300 dark:border-neutral-600 rounded px-3 py-2 bg-white dark:bg-neutral-700 text-neutral-900 dark:text-neutral-100 leading-tight focus:outline-none focus:ring-2 focus:ring-primary-500 h-10" />
    </div>
    <button type="submit"
      class="!rounded-md bg-primary-600 px-4 py-2 !text-neutral hover:!bg-primary-500 dark:bg-primary-800 dark:hover:!bg-primary-700 w-full font-medium">
      Join the newsletter
    </button>
    <input type="hidden" name="ml-submit" value="1">
    <input type="hidden" name="anticsrf" value="true">
    <input type="hidden" name="fields[environment]" value="{{ hugo.Environment }}">
    <input type="hidden" name="fields[origin]" value="{{ .RelPermalink }}">
  </form>

  <p class="text-xs text-neutral-500 dark:text-neutral-400 mt-2 text-center" id="newsletter-privacy">
    No spam, unsubscribe at any time.
  </p>

  <p id="newsletter-status" role="status" aria-live="polite"></p>
</section>
{{ end }}
