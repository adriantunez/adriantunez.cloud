{{ define "main" }}
<section class="about-intro">
  {{ with resources.Get site.Params.author.image }}<img src="{{ (.Fill "200x200").RelPermalink }}" alt="Adri Antunez" width="100" height="100">{{ end }}
  <h1>{{ .Title }}</h1>
  {{ .Content }}
</section>
<div class="project-grid about-cards">
  {{ range slice "/about/background" "/about/career" "/books" }}
    {{ with site.GetPage . }}
      <a class="panel project" href="{{ .RelPermalink }}"><h2>{{ .Title }} →</h2><p>{{ .Description | default .Summary | plainify }}</p></a>
    {{ end }}
  {{ end }}
</div>
{{ end }}
